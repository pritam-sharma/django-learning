{% extends 'mywebsite/base.html' %} {% block title %} Edit Profile {% endblock%}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-lg">
      <div class="card-header bg-success text-white">
        <h3>Edit Profile</h3>
      </div>

      <div class="card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label>Name</label>

            <input
              type="text"
              name="name"
              class="form-control"
              value="{{ user.name }}"
              required
            />
          </div>

          <div class="mb-3">
            <label>Mobile</label>

            <input
              type="text"
              name="mobile"
              class="form-control"
              value="{{ user.mobile }}"
              required
            />
          </div>

          <button class="btn btn-success">Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
